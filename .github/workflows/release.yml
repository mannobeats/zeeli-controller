name: Release

# Run from Actions → Release → Run workflow. It checks the code, builds the console with the
# next version, signs the package and publishes a GitHub release that routers update from.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version goes up"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<EOF
          ${last#v}
          EOF
          case "$BUMP" in
            major) major=$((major + 1)) minor=0 patch=0 ;;
            minor) minor=$((minor + 1)) patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      # the tests run as a development build; only the shipped build carries the version
      - name: Build
        env:
          ZEELI_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm build

      - name: Package and sign
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZEELI_SIGNING_KEY: ${{ secrets.ZEELI_SIGNING_KEY }}
        run: |
          sh tools/release/package.sh "$VERSION"
          node tools/release/sign.mjs release/zeeli-controller.tar.gz
          cp tools/router/zeeli-update release/

      - name: Release notes
        env:
          LAST: ${{ steps.version.outputs.last }}
        run: |
          {
            echo "## What changed"
            echo
            if git rev-parse -q --verify "refs/tags/$LAST" >/dev/null; then
              git log --no-merges --format='- %s' "$LAST..HEAD"
            else
              git log --no-merges --format='- %s'
            fi
            echo
            echo "## Install or update"
            echo
            echo "Routers with the console installed show this update under **System → Firmware**. To install it for the first time, from an SSH session on the router:"
            echo
            echo '```sh'
            echo "uclient-fetch -qO /tmp/zeeli-update https://github.com/$GITHUB_REPOSITORY/releases/latest/download/zeeli-update && sh /tmp/zeeli-update install latest"
            echo '```'
          } > release/notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Zeeli Controller $VERSION" --notes-file release/notes.md \
            release/zeeli-controller.tar.gz release/zeeli-controller.tar.gz.sig release/zeeli-update
